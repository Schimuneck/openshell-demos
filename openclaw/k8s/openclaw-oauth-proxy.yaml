apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-oauth-proxy
  namespace: openshell
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.openclaw: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"openclaw-ui"}}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-nginx-config
  namespace: openshell
data:
  default.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;
    events { worker_connections 64; }
    http {
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;
        access_log /dev/stdout;
        map $http_upgrade $connection_upgrade {
            default upgrade;
            '' close;
        }
        server {
            listen 8081;
            location /healthz { return 200 'ok'; add_header Content-Type text/plain; }
            location / {
                proxy_pass http://openshell.openshell.svc.cluster.local:8080;
                proxy_set_header Host default--openclaw-demo--openclaw-ui.openshell.localhost;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_read_timeout 86400;
                proxy_send_timeout 86400;
            }
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-oauth-proxy
  namespace: openshell
  annotations:
    service.alpha.openshift.io/serving-cert-secret-name: openclaw-oauth-proxy-tls
spec:
  selector:
    app: openclaw-oauth-proxy
  ports:
    - name: https
      port: 443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-oauth-proxy
  namespace: openshell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-oauth-proxy
  template:
    metadata:
      labels:
        app: openclaw-oauth-proxy
    spec:
      serviceAccountName: openclaw-oauth-proxy
      containers:
        - name: nginx
          image: quay.io/nginx/nginx-unprivileged:stable-alpine
          ports:
            - containerPort: 8081
          command: ["nginx"]
          args: ["-g", "daemon off;", "-c", "/etc/nginx/conf.d/default.conf"]
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            httpGet:
              port: 8081
              path: /healthz
            initialDelaySeconds: 2
        - name: oauth-proxy
          image: quay.io/openshift/origin-oauth-proxy:latest
          args:
            - --https-address=:8443
            - --provider=openshift
            - --openshift-service-account=openclaw-oauth-proxy
            - --upstream=http://127.0.0.1:8081
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret=Y2xhd2RlbW9jb29raWVz
            - --cookie-secure=true
            - --email-domain=*
            - --pass-basic-auth=false
            - --pass-access-token=false
            - --skip-provider-button=true
            - --pass-host-header=false
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: tls
              mountPath: /etc/tls/private
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: openclaw-oauth-proxy-tls
        - name: nginx-config
          configMap:
            name: openclaw-nginx-config
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: openclaw-ui
  namespace: openshell
spec:
  to:
    kind: Service
    name: openclaw-oauth-proxy
  port:
    targetPort: https
  tls:
    termination: reencrypt
