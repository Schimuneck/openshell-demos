version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  vertex_ai:
    name: vertex-ai
    binaries:
      - path: /usr/bin/node
    endpoints:
      - host: us-east5-aiplatform.googleapis.com
        port: 443
      - host: oauth2.googleapis.com
        port: 443
  openclaw:
    name: openclaw
    binaries:
      - path: /usr/bin/node
    endpoints:
      - host: registry.npmjs.org
        port: 443
      - host: opencode.ai
        port: 443
  jira:
    name: jira-mcp
    binaries:
      - path: /sandbox/.uv/python/**
      - path: /sandbox/.local/share/uv/tools/**
    endpoints:
      - host: redhat.atlassian.net
        port: 443
  pypi:
    name: pypi
    binaries:
      - path: /sandbox/.uv/python/**
      - path: /sandbox/.local/share/uv/tools/**
      - path: /usr/local/bin/uv
    endpoints:
      - host: pypi.org
        port: 443
      - host: files.pythonhosted.org
        port: 443
